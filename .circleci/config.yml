version: 2.1
orbs:
  go: circleci/go@2.2.4
  python: circleci/python@2.0.3
  slack: circleci/slack@4.12.6

parameters:
  generate-provider:
    type: boolean
    default: false
  publish-provider:
    type: boolean
    default: true
  health-check:
    type: boolean
    default: false
  heartbeat:
    type: boolean
    default: false

commands:
  update-go-dependencies:
    steps:
      - run:
          name: Update stale dependencies
          command: | 
            go get -u github.com/hashicorp/terraform-plugin-framework
            go get github.com/hashicorp/terraform-plugin-sdk/helper/acctest
            go get github.com/hashicorp/terraform-plugin-testing/helper/acctest
            go get github.com/hashicorp/terraform-plugin-testing/helper/resource

jobs:
  download-and-process:
    resource_class: small
    executor:
      name: python/default
      tag: "3.11"
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Create /tmp/workspace/schema/ folder
          command: mkdir -p /tmp/workspace/schema/
      - run:
          name: Download schema
          command: curl -o /tmp/workspace/schema/schema.json https://stoplight.io/api/v1/projects/etleap/api-v2/nodes/api-specs/external-api-v2/reference/etleap-api.v2.json?deref=optimizedBundle
      - run: 
          name: Process schema
          command: python preprocessor/process.py /tmp/workspace/schema/schema.json /tmp/workspace/schema/schema-adapted.json
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - schema
      - store_artifacts:
          path: /tmp/workspace/schema
      - slack/notify:
          event: fail
          channel: -devops

  generate:
    resource_class: 2xlarge
    executor:
      name: go/default
      tag: "1.26.5"
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Install Speakeasy
          command: |
            export VERSION="1.165.1"
            curl -fsSL https://raw.githubusercontent.com/speakeasy-api/speakeasy/main/install.sh | sh
      - run: 
          name: Configure Speakasy
          command: |
            mkdir ~/.speakeasy
            touch ~/.speakeasy/config
            echo "speakeasy_api_key: $SPEAKEASY_API_KEY" >> ~/.speakeasy/config
            echo 'speakeasy_customer_id: ""' >> ~/.speakeasy/config
            echo 'speakeasy_workspace_id: ""' >> ~/.speakeasy/config
      - run:
          name: Generate provider
          command: speakeasy generate sdk --lang terraform -o . -s /tmp/workspace/schema/schema-adapted.json  
      - run:
          name: Check if any changes
          command: |
            if [ -z "$(git status --porcelain)" ]; then 
              echo "Regeneration did not produce any changes; ending here"
              circleci-agent step halt
            fi
      - run:
          name: Check that Etleap's patch applies
          command: |
            if ! git apply --check etleap.patch; then
              echo "etleap.patch does not apply to the regenerated provider. Update it with 'make generate-patch'."
              exit 1
            fi
      - run:
          name: Generate docs
          command: go generate
      - run:
          name: git commit
          command: |
            git config --global user.email "dev@etleap.com"
            git config --global user.name "Etleap Dev"
            git add .
            git commit -m "Regenerated provider and docs"
            git push -q https://${GITHUB_TOKEN}@github.com/etleap/terraform-provider-etleap.git "$CIRCLE_BRANCH"
      - slack/notify:
          channel: -devops

  test:
    resource_class: medium
    executor: 
      name: go/default
      tag: "1.26.5"
    steps:
      - checkout
      - run:
          name: Apply Etleap's patch
          command: git apply etleap.patch
      - restore_cache:
          keys:
            - go-mod-v4-{{ checksum "go.sum" }}
      - run:
          name: Install Dependencies
          command: go get ./...
      - update-go-dependencies
      - run:
          name: Delete resources left behind by earlier test runs
          command: go test ./internal/provider -sweep=all
      - run:
          name: Run tests
          command: TF_ACC=1 gotestsum --junitfile /tmp/test-results/unit-tests.xml --format testdox
      - save_cache:
          key: go-mod-v4-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
      - store_test_results:
          path: /tmp/test-results
      - slack/notify:
          branch_pattern: main
          event: fail
          channel: -devops
        
  
  publish:
    resource_class: large
    executor:
      name: go/default
      tag: "1.26.5"
    steps:
      - checkout
      - run: 
          name: Install GPG
          command: |
            if ! command -v gpg > /dev/null; then
              timeout 5m sudo apt update && timeout 5m sudo apt install -y gnupg
            fi
      - run: 
          name: Import GPG key
          command: |
            echo "$PGP_PRIVATE_KEY" | base64 -d > pk.txt
            gpg --import pk.txt
            rm pk.txt
      - run:
          name: Apply Etleap's patch
          command: git apply etleap.patch
      - run: 
          name: Tag if needed
          command: |
            if [[ "$CIRCLE_PROJECT_REPONAME" == "terraform-provider-etleap-private" ]]; then
              echo "Skipping release on private repo; cherry-pick to public repo to publish"
              circleci-agent step halt
              exit 0
            fi
            if [[ "$(git name-rev --name-only --tags HEAD)" == "undefined" ]]; then
              echo "No tag found at HEAD; trying to tag and release"
              NEW_TAG=v$(yq .terraform.version .speakeasy/gen.yaml)
              if [ $(git tag -l "$NEW_TAG") ]; then
                echo "Tag $NEW_TAG already exists on an earlier commit; skipping. The changes at HEAD are not released until the version in .speakeasy/gen.yaml changes."
                circleci-agent step halt
              else
                git tag v$(yq .terraform.version .speakeasy/gen.yaml)
                git push -q https://${GITHUB_TOKEN}@github.com/etleap/terraform-provider-etleap.git "$CIRCLE_BRANCH" --tags
              fi
            else
              echo "Tag exists; Publishing existing tag"
            fi
      - update-go-dependencies
      - run:
          name: Release
          command: curl -sfL https://goreleaser.com/static/run | bash /dev/stdin release --skip=validate --clean -p 4
      - slack/notify:
          channel: -devops

  health-check:
    resource_class: small
    executor:
      name: python/default
      tag: "3.11"
    steps:
      - checkout
      - run:
          name: Check provider health
          command: python scripts/health_check.py
      - slack/notify:
          event: fail
          channel: -devops
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Terraform provider health check failed*\n${HEALTH_SUMMARY}\n<${CIRCLE_BUILD_URL}|View job>"
                  }
                }
              ]
            }
      - when:
          condition: << pipeline.parameters.heartbeat >>
          steps:
            - slack/notify:
                event: pass
                channel: -devops
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*Terraform provider is healthy*\n${HEALTH_SUMMARY}"
                        }
                      }
                    ]
                  }

workflows:
  version: 2
  regenerate:
    when:
      and:
        - equal: [ true, <<pipeline.parameters.generate-provider>>]
    jobs:
      - download-and-process:
          context:
            - CircleCI context
      - generate:
          context: 
            - Speakeasy
            - CircleCI context
          requires: 
            - download-and-process
  
  test-and-publish:
    when:
      and:
        - equal: [ true, <<pipeline.parameters.publish-provider>> ]
        - not: << pipeline.parameters.health-check >>
    jobs:
      - test:
          context: 
            - Terraform Provider Testing
            - CircleCI context
      - publish:
          context: 
            - Speakeasy
            - CircleCI context
          requires:
            - test
          filters:
            branches:
              only: main
          

  health-check:
    when:
      and:
        - equal: [ true, << pipeline.parameters.health-check >> ]
    jobs:
      - health-check:
          context:
            - CircleCI context
